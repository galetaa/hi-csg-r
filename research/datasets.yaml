lineage_rules:
  - Не считать historical raw_inventory доказательством наличия файлов сейчас.
  - После восстановления записать SHA-256 архивов и фактическую revision в локальный provenance snapshot.
  - Не коммитить лицензированное содержимое IAM/HKR или производные изображения, если это запрещено условиями.
  - Проверять writer/page-disjoint ограничения до обучения, а не после получения метрик.
